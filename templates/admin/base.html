<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Administration{% endblock %} — Lycée Eugène Decomble</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f6f7fb;background:#0b1220;color-scheme:dark}*{box-sizing:border-box}body{margin:0;line-height:1.55}a{color:#b8d5ff;text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 0 24px;border-bottom:1px solid #263246}.brand{font-weight:800;color:#fff;font-size:19px}.nav{display:flex;gap:15px;flex-wrap:wrap}.nav a{font-size:14px}.hero{padding:26px 0}.muted{color:#aab5c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#121c2d;border:1px solid #26364c;border-radius:16px;padding:18px;margin:12px 0}.stat{font-size:32px;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}input,textarea,select{font:inherit;color:#f8fafc;background:#0b1220;border:1px solid #35445a;border-radius:9px;padding:11px;width:100%}textarea{min-height:100px;resize:vertical}label{font-size:14px;color:#cbd5e1}button,.button{display:inline-block;font:inherit;background:#dbeafe;color:#10213b;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:750}button.danger{background:#fee2e2;color:#7f1d1d}button.secondary,.button.secondary{background:#26364c;color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px 14px;border-radius:10px;background:#172c40;margin:10px 0}.notice.error{background:#45212a}.notice.success{background:#15382f}.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#24354b}.item-title{font-weight:750;font-size:18px}small{color:#aab5c7}@media(max-width:700px){.shell{padding:16px}.row{grid-template-columns:1fr}.top{align-items:flex-start}}

<style>
:root{--accent:#d6a783;--line:#29364a;--panel:#121b2b;--panel2:#172337;--ink:#f6f7fb;--muted:#aab5c7}
body{background:radial-gradient(ellipse at 85% 0%,rgba(91,112,150,.12),transparent 38%),#0b1220;color:var(--ink)}
.shell{width:min(100% - 32px,1180px);padding:22px 0 30px}
.top{gap:18px;padding:12px 0 20px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;letter-spacing:-.2px}
.brand:before{content:"LD";display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#d6a783,#8c5b3e);color:#1b130f;font-size:13px;font-weight:900}
.nav{align-items:center;gap:7px}
.nav a{padding:8px 10px;border-radius:9px;color:#cbd5e1}
.nav a:hover{background:#1b2940;text-decoration:none;color:white}
.hero{padding:30px 0 22px}
h1{font-size:clamp(2rem,4vw,2.8rem);letter-spacing:-1.1px;line-height:1.1;margin:8px 0}
h2{font-size:1.15rem;letter-spacing:-.2px;margin-bottom:12px}
.muted,small{color:var(--muted)}
.grid{gap:16px}
.card{background:linear-gradient(145deg,rgba(23,35,55,.96),rgba(17,27,43,.96));border-color:var(--line);border-radius:17px;padding:22px;margin:14px 0;box-shadow:0 12px 30px rgba(0,0,0,.10)}
.grid .card{margin:0}
.stat{font-size:clamp(2rem,4vw,2.6rem);letter-spacing:-1px;color:#fff;margin:4px 0 10px}
.field{gap:7px;margin:14px 0}
label{color:#d8deea;font-weight:650}
input,textarea,select{background:#0b1322;border-color:#394861;border-radius:11px;padding:12px 13px;transition:border-color .18s,box-shadow .18s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(214,167,131,.12)}
input[type=checkbox]{width:auto;accent-color:var(--accent);transform:translateY(1px)}
button,.button{background:linear-gradient(135deg,#e4c1a4,#c79673);color:#21160f;border-radius:10px;padding:11px 15px;font-weight:800;text-decoration:none;transition:filter .2s,transform .2s}
button:hover,.button:hover{filter:brightness(1.06);transform:translateY(-1px);text-decoration:none}
button.secondary,.button.secondary{background:#26364c;color:#f6f7fb}
button.danger{background:#572b35;color:#ffe3e7}
.actions{align-items:center;gap:9px}
.notice{border:1px solid #2c5065;background:#142c3d;border-radius:12px;padding:13px 15px}
.notice.error{border-color:#713744;background:#3a202a;color:#ffe1e6}
.notice.success{border-color:#285d4f;background:#15352f;color:#d6fff1}
.pill{display:inline-block;margin-left:5px;background:#24354b;color:#dbeafe;padding:4px 9px}
.item-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
footer{border-top:1px solid rgba(255,255,255,.07)}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:700px){
 .shell{width:calc(100% - 28px);padding-top:14px}
 .top{display:block}
 .nav{margin-top:14px;gap:6px}
 .nav a{background:#121c2d;padding:8px 9px}
 .nav form{margin-top:4px}
 .nav button{padding:8px 10px}
 .card{padding:17px}
 .hero{padding-top:24px}
}
</style>

</style></head><body><div class="shell"><header class="top"><a class="brand" href="{{ url_for('admin_dashboard') }}">Lycée Eugène Decomble · Admin</a><nav class="nav"><a href="{{ url_for('admin_dashboard') }}">Tableau de bord</a><a href="{{ url_for('admin_formations') }}">Formations</a><a href="{{ url_for('admin_news') }}">Actualités</a><a href="{{ url_for('admin_events') }}">Événements</a><a href="{{ url_for('admin_users') }}">Utilisateurs</a><a href="/" target="_blank" rel="noopener">Voir le site ↗</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="secondary">Déconnexion</button></form></nav></header>{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}<footer class="muted" style="padding:30px 0 10px;font-size:12px">Administration privée · Ne partage jamais tes identifiants.</footer></div></body></html>
