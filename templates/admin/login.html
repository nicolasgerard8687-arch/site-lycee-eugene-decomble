<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion administrateur</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#f8fafc;font:16px system-ui}.card{width:min(440px,calc(100% - 32px));padding:28px;background:#121c2d;border:1px solid #26364c;border-radius:18px}label{display:block;margin:14px 0 6px;color:#cbd5e1}input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #35445a;background:#0b1220;color:white}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:#dbeafe;color:#10213b;font-weight:800;cursor:pointer}.error{background:#45212a;padding:10px;border-radius:8px}</style></head><body><main class="card"><p style="color:#9bbce9;font-weight:800">LYCÉE EUGÈNE DECOMBLE</p><h1>Administration</h1><p style="color:#aab5c7">Connecte-toi pour gérer les contenus du site.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Adresse administrateur</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Se connecter</button></form><p><a href="/" style="color:#b8d5ff">← Retour au site</a></p></main></body></html>
