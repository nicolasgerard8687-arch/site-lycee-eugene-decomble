<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — Lycée Eugène Decomble</title><style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#f6f7fb;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;box-sizing:border-box}.panel{width:min(100%,430px);background:#121c2d;border:1px solid #26364c;border-radius:18px;padding:26px;box-sizing:border-box}h1{margin-top:0}label{display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;border:1px solid #394861;background:#0b1322;color:white;font:inherit}button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:9px;background:#d6a783;font-weight:800;font:inherit;cursor:pointer}.error{background:#45212a;padding:10px;border-radius:8px}.muted{color:#aab5c7}a{color:#d6a783}</style></head><body><main class="panel"><p class="muted">LYCÉE EUGÈNE DECOMBLE</p><h1>Créer un compte</h1><p class="muted">Crée ton compte personnel pour le site.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="username">Nom d’utilisateur</label><input id="username" name="username" required minlength="3" maxlength="40" autocomplete="username"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" required autocomplete="email"><label for="password">Mot de passe (10 caractères minimum)</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password"><button type="submit">Créer mon compte</button></form><p>Déjà inscrit ? <a href="{{ url_for('user_login') }}">Se connecter</a></p><p><a href="/">← Retour au site</a></p></main></body></html>
