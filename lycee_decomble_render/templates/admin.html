<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — Lycée Eugène Decomble</title><style>:root{color-scheme:dark;--bg:#090909;--panel:#151515;--accent:#c89a78;--text:#f5eee8;--muted:#aaa}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto}h1,h2{color:var(--accent)}section{background:var(--panel);border:1px solid #333;border-radius:16px;padding:22px;margin:18px 0}form{display:grid;gap:10px}input,textarea,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #444;background:#202020;color:var(--text)}button{cursor:pointer;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.item{border:1px solid #333;padding:14px;border-radius:12px;margin:10px 0}.muted{color:var(--muted)}#status{white-space:pre-wrap;color:var(--accent)}a{color:var(--accent)}</style></head><body><main><p><a href="/">← Retour au site</a></p><h1>Administration du site</h1><p class="muted">Connectez-vous avec les identifiants définis dans les variables d’environnement Render. Cette page utilise l’API protégée.</p><section><h2>Connexion administrateur</h2><form id="login"><label>E-mail<input name="email" type="email" required></label><label>Mot de passe<input name="password" type="password" required></label><button>Se connecter</button></form><p id="status" role="status"></p><button id="refresh" hidden>Actualiser les données</button></section><div id="dashboard" hidden><div class="grid"><section><h2>Créer une formation</h2><form id="newFormation"><label>Titre<input name="title" required maxlength="180"></label><label>Niveau<input name="level" value="Bac professionnel"></label><label>Catégorie<select name="category"><option value="cap">CAP</option><option value="seconde">Seconde pro</option><option value="bac" selected>Bac pro</option><option value="bts">BTS</option><option value="dispositif">Dispositif</option></select></label><label>Domaine<input name="domain" value="Général"></label><label>Description<textarea name="description" rows="3"></textarea></label><button>Enregistrer</button></form></section><section><h2>Créer un événement</h2><form id="newEvent"><label>Titre<input name="title" required maxlength="180"></label><label>Description<textarea name="description" rows="3"></textarea></label><label>Date et heure (facultatif)<input name="starts_at" type="datetime-local"></label><label>Lieu<input name="location" value="Lycée Eugène Decomble"></label><button>Publier l’événement</button></form></section></div><section><h2>Formations</h2><div id="formations"></div></section><section><h2>Événements</h2><div id="events"></div></section><section><h2>Messages reçus</h2><div id="messages"></div></section></div></main><script>
const statusEl=document.getElementById('status');const api=async(path,opt={})=>{const h={'Content-Type':'application/json',...(opt.headers||{})};const t=sessionStorage.getItem('lyceeToken');if(t)h.Authorization='Bearer '+t;const r=await fetch(path,{...opt,headers:h});const d=await r.json().catch(()=>({error:'Réponse invalide'}));if(!r.ok)throw Error(d.error||'Erreur');return d};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('login').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:f.get('email'),password:f.get('password')})});if(d.user.role!=='admin')throw Error('Ce compte n’a pas les droits administrateur.');sessionStorage.setItem('lyceeToken',d.token);statusEl.textContent='Connecté comme administrateur.';document.getElementById('dashboard').hidden=false;document.getElementById('refresh').hidden=false;await refreshAll()}catch(err){statusEl.textContent=err.message}};
async function submitForm(id,path){const f=document.getElementById(id);f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.starts_at){d.starts_at=new Date(d.starts_at).toISOString()}else if('starts_at'in d)d.starts_at=null;try{await api(path,{method:'POST',body:JSON.stringify(d)});statusEl.textContent='Enregistré.';f.reset();await refreshAll()}catch(err){statusEl.textContent=err.message}}}submitForm('newFormation','/api/admin/formations');submitForm('newEvent','/api/admin/events');
async function refreshAll(){try{const [fs,es,ms]=await Promise.all([api('/api/formations'),api('/api/events'),api('/api/admin/messages')]);document.getElementById('formations').innerHTML=fs.map(f=>`<div class="item"><b>${esc(f.title)}</b><p>${esc(f.level)} · ${esc(f.domain)}</p><p>${esc(f.description)}</p><button onclick="hideFormation(${f.id})">Masquer</button></div>`).join('')||'<p>Aucune formation.</p>';document.getElementById('events').innerHTML=es.map(e=>`<div class="item"><b>${esc(e.title)}</b><p>${esc(e.starts_at||'Date à confirmer')} · ${esc(e.location)}</p><p>${esc(e.description)}</p><button onclick="hideEvent(${e.id})">Dépublier</button></div>`).join('')||'<p>Aucun événement.</p>';document.getElementById('messages').innerHTML=ms.map(m=>`<div class="item"><b>${esc(m.subject)}</b> — ${esc(m.status)}<p>${esc(m.name)} · ${esc(m.email)} · ${esc(m.created_at)}</p><p>${esc(m.body)}</p><select id="msgstatus${m.id}"><option ${m.status==='nouveau'?'selected':''}>nouveau</option><option ${m.status==='lu'?'selected':''}>lu</option><option ${m.status==='traite'?'selected':''}>traite</option><option ${m.status==='archive'?'selected':''}>archive</option></select> <button onclick="updateMessage(${m.id})">Changer le statut</button></div>`).join('')||'<p>Aucun message reçu.</p>'}catch(e){statusEl.textContent=e.message}}
window.hideFormation=async id=>{try{await api('/api/admin/formations/'+id,{method:'DELETE'});await refreshAll()}catch(e){statusEl.textContent=e.message}};window.hideEvent=async id=>{try{await api('/api/admin/events/'+id,{method:'DELETE'});await refreshAll()}catch(e){statusEl.textContent=e.message}};window.updateMessage=async id=>{try{await api('/api/admin/messages/'+id,{method:'PATCH',body:JSON.stringify({status:document.getElementById('msgstatus'+id).value})});statusEl.textContent='Statut du message mis à jour.';await refreshAll()}catch(e){statusEl.textContent=e.message}};document.getElementById('refresh').onclick=refreshAll;
</script></body></html>
